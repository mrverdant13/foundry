# Runs RIPPLE_PACKAGES-scoped pre-publish checks on Dart package release PRs.
#
# Trigger: pull requests to main that touch release manifest files.
# Release PR title regex (parse-title job):
#   ^chore\(([^)]+)\): release (.+)$
#   Example: chore(foundry_core): release 0.0.1-dev.2
# Release PR branch name (resolve-package job):
#   <package>/chore/release-<version>
#   Example: foundry_core/chore/release-0.0.1-dev.2
# Publishable packages: foundry_core, foundry_cli (ripple group publishable).
name: Dart release PR check

on:
  pull_request:
    branches:
      - main
    paths:
      - packages/*/pubspec.yaml
      - packages/*/CHANGELOG.md

jobs:
  parse-title:
    name: Parse release PR title
    runs-on: ubuntu-latest
    outputs:
      matched: ${{ steps.parse.outputs.matched }}
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Identify package and version from PR title
        id: parse
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          pattern='^chore\(([^)]+)\): release (.+)$'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
            echo "package=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
          fi

  resolve-package:
    name: Resolve release package
    needs: parse-title
    if: needs.parse-title.outputs.matched == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: 74c8fe4c0e246c818071e1f83b207a0616c5f1d2}}
      - name: Bootstrap packages
        run: |
          dart pub get
          ripple exec --fail-fast -- dart pub get
      - name: Verify release manifest changes match title
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE_PACKAGE: ${{ needs.parse-title.outputs.package }}
          TITLE_VERSION: ${{ needs.parse-title.outputs.version }}
        run: |
          set -euo pipefail

          expected_branch="${TITLE_PACKAGE}/chore/release-${TITLE_VERSION}"
          if [[ "$PR_BRANCH" != "$expected_branch" ]]; then
            echo "::error::Release PR branch must be named '$expected_branch' (got '$PR_BRANCH')."
            exit 1
          fi

          mapfile -t publishable_packages < <(ripple list --group publishable | xargs -n1 basename)

          is_publishable() {
            local candidate="$1"
            for package in "${publishable_packages[@]}"; do
              if [[ "$package" == "$candidate" ]]; then
                return 0
              fi
            done
            return 1
          }

          if ! is_publishable "$TITLE_PACKAGE"; then
            echo "::error::Unknown publishable package '$TITLE_PACKAGE'. Expected one of: ${publishable_packages[*]}"
            exit 1
          fi

          declare -A changed_packages=()

          file_pattern='^packages/([^/]+)/(pubspec\.yaml|CHANGELOG\.md)$'
          while IFS= read -r file; do
            if [[ "$file" =~ $file_pattern ]]; then
              package="${BASH_REMATCH[1]}"
              if is_publishable "$package"; then
                changed_packages["$package"]=1
              fi
            fi
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if [[ "${#changed_packages[@]}" -eq 0 ]]; then
            echo "::error::No release manifest changes detected in this pull request."
            exit 1
          fi

          if [[ "${#changed_packages[@]}" -gt 1 ]]; then
            packages_list="$(printf '%s, ' "${!changed_packages[@]}")"
            packages_list="${packages_list%, }"
            echo "::error::Release PRs must change exactly one publishable package. Multiple packages were modified: $packages_list. Split into separate release PRs — see CONTRIBUTING.md."
            exit 1
          fi

          changed_package="${!changed_packages[@]}"

          if [[ "$changed_package" != "$TITLE_PACKAGE" ]]; then
            echo "::error::Release manifest changes target $changed_package but the PR title indicates $TITLE_PACKAGE."
            exit 1
          fi

  release-check:
    name: release.check (${{ needs.parse-title.outputs.package }} ${{ needs.parse-title.outputs.version }})
    needs:
      - parse-title
      - resolve-package
    if: needs.parse-title.outputs.matched == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Dart
        uses: dart-lang/setup-dart@v1
      - name: Install ripple
        uses: ./.github/actions/install-dart-cli
        with:
          package: >-
            ripple_cli@{git: {url: https://github.com/mrverdant13/ripple.git, ref: 74c8fe4c0e246c818071e1f83b207a0616c5f1d2}}
      - name: Bootstrap packages
        run: |
          dart pub get
          ripple exec --fail-fast -- dart pub get
      - name: Format and analyze
        run: |
          ripple run format.ci
          ripple run analyze.ci --fail-fast
      - name: Run package-scoped pre-publish checks
        env:
          RIPPLE_PACKAGES: ${{ needs.parse-title.outputs.package }}
        run: |
          ripple run test.ci --fail-fast
          ripple run pub-score.local --fail-fast
          ripple exec --group publishable --fail-fast -- dart pub publish --dry-run
      - name: Set step summary
        if: always()
        env:
          PACKAGE: ${{ needs.parse-title.outputs.package }}
        run: |
          report="packages/${PACKAGE}/.dart_tool/local_pub_score.md"
          if [[ -f "$report" ]]; then
            echo "### ${PACKAGE}" >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
