name: foundry_monorepo

environment:
  sdk: ">=3.5.0 <4.0.0"

dev_dependencies:
  coverde: ^0.4.0
  melos: ^7.5.1
  very_good_analysis: ^10.0.0

melos:
  categories:
    e2e:
      - packages/foundry_core/e2e
      - packages/foundry_cli/e2e
    publishable:
      - packages/foundry_core
      - packages/foundry_cli

  repository: https://github.com/mrverdant13/foundry

  command:
    bootstrap:
      environment:
        sdk: ">=3.5.0 <4.0.0"

  scripts:
    format:
      description: Format a package
      run: dart format .
      exec:
        concurrency: 1
        orderDependents: true
    format.ci:
      description: Format all packages (CI)
      run: dart format --set-exit-if-changed .

    analyze:
      description: Analyze a package
      run: dart analyze .
      exec:
        concurrency: 1
        orderDependents: true
    analyze.ci:
      description: Analyze all packages (CI)
      run: dart analyze --fatal-infos --fatal-warnings .

workspace:
  - packages/foundry_core/
  - packages/foundry_core/e2e/
  - packages/foundry_cli/
  - packages/foundry_cli/e2e/
